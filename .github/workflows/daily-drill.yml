name: DrillOps Pipeline

on:
  schedule:
    # Morning Challenge: 08:00 AM UTC (Adjust as needed for your timezone)
    - cron: '0 8 * * *'
    # Evening Solution & Deep Dive: 06:00 PM UTC (18:00 UTC)
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      phase:
        description: 'Which phase to trigger'
        required: true
        default: 'morning'
        type: choice
        options:
          - morning
          - evening
      topic:
        description: 'Override topic (devops, golang, nodejs, sre, tools, architecture, incident)'
        required: false
        default: ''
      dry_run:
        description: 'Run without sending real notifications (dry run)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  run-drill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Determine Phase & Execution Flags
        id: flags
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PHASE="${{ inputs.phase }}"
            DRY_RUN="${{ inputs.dry_run }}"
            TOPIC="${{ inputs.topic }}"
          else
            # Triggered by cron schedule: 08:00 UTC = morning, 18:00 UTC = evening
            CURRENT_HOUR=$(date -u +"%H")
            if [ "$CURRENT_HOUR" -lt 12 ]; then
              PHASE="morning"
            else
              PHASE="evening"
            fi
            DRY_RUN="false"
            TOPIC=""
          fi

          CMD_ARGS="--phase $PHASE"
          if [ "$DRY_RUN" = "true" ]; then
            CMD_ARGS="$CMD_ARGS --dry-run"
          fi
          if [ -n "$TOPIC" ]; then
            CMD_ARGS="$CMD_ARGS --topic $TOPIC"
          fi

          echo "phase=$PHASE" >> $GITHUB_OUTPUT
          echo "cmd_args=$CMD_ARGS" >> $GITHUB_OUTPUT

      - name: Run DrillOps Pipeline
        env:
          NOTIFICATION_PROVIDER: ${{ secrets.NOTIFICATION_PROVIDER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WHATSAPP_PROVIDER: ${{ secrets.WHATSAPP_PROVIDER }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_API_KEY: ${{ secrets.CALLMEBOT_API_KEY }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_WHATSAPP_FROM: ${{ secrets.TWILIO_WHATSAPP_FROM }}
          TWILIO_WHATSAPP_TO: ${{ secrets.TWILIO_WHATSAPP_TO }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node src/index.js ${{ steps.flags.outputs.cmd_args }}

      - name: Commit Updated Drill State
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/state/
          if git diff --staged --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "chore(state): update DrillOps drill state [skip ci]"
            git push
          fi
